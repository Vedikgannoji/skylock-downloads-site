<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" fill="none">
  <!-- Windows Explorer Window Frame -->
  <rect width="600" height="360" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
  <!-- Title bar -->
  <rect width="600" height="36" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="18" cy="18" r="4.5" fill="#EF4444"/>
  <circle cx="32" cy="18" r="4.5" fill="#F59E0B"/>
  <circle cx="46" cy="18" r="4.5" fill="#10B981"/>
  <text x="300" y="22" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#4B5563" text-anchor="middle">SkyLock-Portable — File Explorer</text>

  <!-- Address Bar -->
  <rect x="16" y="46" width="568" height="30" rx="4" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
  <text x="32" y="66" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#4B5563">Downloads &gt; SkyLock-Portable</text>

  <!-- Table Header -->
  <rect x="16" y="86" width="568" height="26" fill="#F9FAFB"/>
  <text x="32" y="103" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Name</text>
  <text x="330" y="103" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Date modified</text>
  <text x="440" y="103" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Type</text>
  <text x="530" y="103" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7280">Size</text>

  <!-- Row 1: _internal folder -->
  <rect x="16" y="116" width="568" height="36" fill="#FFFFFF"/>
  <rect x="28" y="125" width="16" height="14" rx="2" fill="#FBBF24"/>
  <text x="54" y="138" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4B5563">_internal</text>
  <text x="330" y="138" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Today, 21:30</text>
  <text x="440" y="138" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">File folder</text>

  <!-- Row 2: README.txt -->
  <rect x="16" y="154" width="568" height="36" fill="#FFFFFF"/>
  <rect x="28" y="163" width="14" height="18" rx="2" fill="#9CA3AF"/>
  <line x1="32" y1="168" x2="38" y2="168" stroke="#FFFFFF" stroke-width="1.5"/>
  <line x1="32" y1="172" x2="38" y2="172" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="54" y="176" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#4B5563">README.txt</text>
  <text x="330" y="176" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Today, 21:30</text>
  <text x="440" y="176" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Text Document</text>
  <text x="530" y="176" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">2 KB</text>

  <!-- Row 3: SkyLock.exe (Primary Action - Highlighted) -->
  <rect x="16" y="192" width="568" height="46" rx="4" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <!-- Exe optic icon -->
  <rect x="28" y="204" width="18" height="18" rx="3" fill="#2563EB"/>
  <circle cx="37" cy="213" r="5" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
  <circle cx="37" cy="213" r="1.5" fill="#FFFFFF"/>
  <text x="54" y="217" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1E40AF">SkyLock.exe</text>
  <text x="54" y="231" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#2563EB">DOUBLE-CLICK TO LAUNCH</text>
  <text x="330" y="221" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#1E40AF">Today, 21:30</text>
  <text x="440" y="221" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1E40AF">Application</text>
  <text x="530" y="221" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#1E40AF">6,118 KB</text>

  <!-- Launch pointer callout -->
  <g transform="translate(140, 260)">
    <rect width="320" height="74" rx="8" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.04))"/>
    <circle cx="28" cy="37" r="14" fill="#ECFDF5"/>
    <path d="M24,37 L27,40 L33,34" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#111827">Instant Launch — Zero Setup</text>
    <text x="52" y="49" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6B7280">Runs out of the box on Windows 10 &amp; 11.</text>
    <text x="52" y="64" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#059669">No Python or external drivers required.</text>
  </g>
</svg>
